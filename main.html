<!DOCTYPE html>
<html lang="fr">
 <head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Carte d'identite otaku</title>
   <style>
 body {
  font-family: 'Open Sans', sans-serif;
}

  .ball {
    border-radius: 13px;
    background: linear-gradient(20deg, #81F4F8, #8E6BE8);
    border: 3px none;
    box-shadow: 3px 3px 3px 3px #5CDBFA;
    font-size: 16px;
}

.header {
    text-align: center;
    font-size: xx-large;
    color: rgb(38, 251, 255);
    text-shadow: 1px 4px 5px rgb(38, 251, 255);
    font-weight: bold;
}

.picture {
    text-align: center;
}
#photo_profil {
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}
.contenue {
    background-color: transparent;
    font-size: 15px;
}

label{
    display: block;
    margin-bottom: 10px;
}

input[type="text"] {
    width:300px;
    height:17px;
    margin-bottom: 20px;
    padding: 10px;
    border: 1px solid #ccc;
}
.button {
    text-align: center;
    margin: 20px;
}

button {
    background-color: #4CAF50;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #3e8e41;
} /*
 #carte {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}*//*
 #carte {
  background: linear-gradient(45deg, #ff69b4, #ffe6cc);
  opacity: 0.8;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}*/
.vrai{
  border-radius:12px 12px 12px 12px ; 
  box-shadow:4px 4px 4px 4px;
  margin:15px;
  width: 400px;
  height: auto;
  background-color:#3D5AFE;
}

#carte {
  /*background: rgba(255, 255, 255, 0.2); */
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 30px;
  /*box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
  border: 10px solid rgba(255, 255, 255, 0.3);*/
}
.identite{
    text-align: center;
    font-size: xx-large;
    color: rgb(38, 251, 255);
    text-shadow: 1px 4px 5px rgb(38, 251, 255);
    font-weight: bold;
}
.cite{
  font-size:20px;
  font-style:italic;
  text-align:center;
}
h6{
  text-align: center;
  background-color: #F6E7B6;
}
#telecharger-btn{
  display:none;
}
</style>
</head>
<body>
    <div class="ball">
        <div class="header">Carte d'identité Otaku</div>
        <div class="picture">
            <input type="file" name="picture" id="imageInput" accept="image/*" onchange="lireImage(this)">
            <img id="photo_profil" width="110" height="110">
        </div>
        <div class="contenue">
            <label>Nom:</label>
            <input type="text" id="nom" name="Nom" maxlength="14"/><br>
            <label>Prenom:</label>
            <input type="text" id="prenom" name="Prenom" maxlength="14"/><br>
            <label>Waifu:</label>
            <input type="text" name="waifu" maxlength="14" id="waifu"><br>
            <label>Personnage préféré:</label>
            <input type="text" name="Personnage préféré" maxlength="15" id="personnage"><br>
            <label>Citation:</label>
            <input type="text" name="Citation" maxlength="150" id="citation">
        </div>
   </div>
      <div class="button">
            <button onclick="genererCarte()">Générer la carte</button>
      </div>
    <div id="carte"></div>
       </div>
      <div class="button">
        <button id="telecharger-btn" onclick="telechargerCarte()">Télécharger la carte</button>
    <script >
        function lireImage(input) {
            let fichier = input.files[0];
            let lecteur = new FileReader();
            lecteur.onload = function(e) {
                let image = document.getElementById('photo_profil');
                image.src = e.target.result;
            };
            lecteur.readAsDataURL(fichier);
        }function genererCarte() {
    let prenom = document.getElementById('prenom').value;
    let nom = document.getElementById('nom').value;
    let waifu = document.getElementById('waifu').value;
    let personnage = document.getElementById('personnage').value;
    let citation = document.getElementById('citation').value;
    let photoProfil = document.getElementById('photo_profil');
    
    if (nom === "" || prenom === "" || waifu === "" || personnage === "" || citation === "" || photoProfil.src == "") {
        alert("Veuillez tout remplir et ajouter l'image !!!");
        return;
    }
    
    let carte = `
        <div class="vrai">
            <div class="identite">
                <p>Carte d'identité Otaku</p>
            </div>
            <img src="${photoProfil.src}" width="110" height="110">
            <p>Nom: ${nom}</p>
            <p>Prénom: ${prenom}</p>
            <p>Waifu: ${waifu}</p>
            <p>Personnage préféré : ${personnage}</p>
            <div class="cite">
                <p>"${citation}"</p>
            </div>
            <h6>Ceci est une carte d'identité pour Otaku</h6>
        </div>
    `;
    
    let carteElement = document.getElementById('carte');
    carteElement.innerHTML = carte;
    
    let telechargerBtn = document.getElementById('telecharger-btn');
    telechargerBtn.style.display = 'block';

  // Générez l'image directement ici si vous le souhaitez
  html2canvas(carteElement, { scale: 2 }).then(canvas => {
    const link = document.createElement('a');
    link.href = canvas.toDataURL();
    link.download = 'carte-identite-otaku.png';
    link.click();
  });
}
function telechargerCarte() {
  html2canvas(carteElement, { scale: 2 }).then(canvas => {
    canvas.toBlob(blob => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'carte-identite-otaku.png';
      link.click();
      URL.revokeObjectURL(link.href);
    });
  });
}
</script>
</body>
</html>
