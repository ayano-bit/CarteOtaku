<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte d'identité Otaku</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #0a0f2c, #050714);
            color: #e6faff;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .ball {
            background: linear-gradient(135deg, #0d1b4c, #101a3c);
            border: 2px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            padding: 20px;
            border-radius: 15px;
            width: 350px;
        }

        .header {
            color: #00f6ff;
            text-shadow: 0 0 10px #00f6ff;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        label { color: #9ffcff; display: block; margin-top: 10px; }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #fff;
            width: 90%;
            padding: 8px;
            border-radius: 6px;
        }

        button {
            background: linear-gradient(135deg, #00f6ff, #8a2be2);
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 20px 0;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        /* STYLE DE LA CARTE GÉNÉRÉE */
        #carte { margin-top: 20px; }

        .vrai {
            width: 420px;
            height: 240px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0b133d, #0f1a4f);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            color: white;
        }

        .carte-header {
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 5px;
            margin-bottom: 10px;
            color: #00f6ff;
        }

        .carte-body { display: flex; flex: 1; }

        .photo-zone img {
            width: 110px;
            height: 140px;
            object-fit: cover;
            border: 2px solid #00f6ff;
            border-radius: 8px;
        }

        .info-zone { flex: 1; padding-left: 15px; font-size: 13px; }

        .ligne { display: flex; margin-bottom: 4px; }

        .cle { width: 90px; color: #00f6ff; font-weight: bold; }

        #telecharger-btn { display: none; background: #2ecc71; }
    </style>
</head>
<body>

    <div class="ball">
        <div class="header">Carte Otaku</div>
        <input type="file" id="imageInput" accept="image/*" onchange="lireImage(this)">
        <img id="temp_img" style="display:none;">
        
        <label>Nom:</label>
        <input type="text" id="nom" maxlength="14">
        <label>Prénom:</label>
        <input type="text" id="prenom" maxlength="14">
        <label>Waifu:</label>
        <input type="text" id="waifu" maxlength="14">
        <label>Personnage préféré:</label>
        <input type="text" id="personnage" maxlength="15">
        <label>Citation:</label>
        <input type="text" id="citation" maxlength="100">

        <button onclick="genererCarte()">Générer la carte</button>
    </div>

    <div id="carte"></div>
    
    <button id="telecharger-btn" onclick="telechargerCarte()">Télécharger la carte (PNG)</button>

    <script>
        let imageBase64 = "";

        function lireImage(input) {
            if (input.files && input.files[0]) {
                let lecteur = new FileReader();
                lecteur.onload = function(e) {
                    imageBase64 = e.target.result;
                };
                lecteur.readAsDataURL(input.files[0]);
            }
        }

        function genererCarte() {
            const nom = document.getElementById('nom').value;
            const prenom = document.getElementById('prenom').value;
            const waifu = document.getElementById('waifu').value;
            const perso = document.getElementById('personnage').value;
            const citation = document.getElementById('citation').value;

            if (!nom || !prenom || !imageBase64) {
                alert("Remplissez au moins le Nom, Prénom et l'Image !");
                return;
            }

            const codeCarte = `
                <div class="vrai">
                    <div class="carte-header">CARTE D’IDENTITÉ OTAKU</div>
                    <div class="carte-body">
                        <div class="photo-zone">
                            <img src="${imageBase64}">
                        </div>
                        <div class="info-zone">
                            <div class="ligne"><div class="cle">ID :</div><div class="valeur">OTK-${Math.floor(100000+Math.random()*900000)}</div></div>
                            <div class="ligne"><div class="cle">Nom :</div><div class="valeur">${nom}</div></div>
                            <div class="ligne"><div class="cle">Prénom :</div><div class="valeur">${prenom}</div></div>
                            <div class="ligne"><div class="cle">Waifu :</div><div class="valeur">${waifu}</div></div>
                            <div class="ligne"><div class="cle">Perso :</div><div class="valeur">${perso}</div></div>
                            <div class="ligne"><div class="cle">Citation :</div><div class="valeur">"${citation}"</div></div>
                        </div>
                    </div>
                </div>`;

            document.getElementById('carte').innerHTML = codeCarte;
            document.getElementById('telecharger-btn').style.display = 'block';
        }

        function telechargerCarte() {
            const container = document.getElementById('carte');
            html2canvas(container, {
                scale: 2,
                backgroundColor: null,
                logging: false,
                useCORS: true
            }).then(canvas => {
                const lien = document.createElement('a');
                lien.href = canvas.toDataURL("image/png");
                lien.download = "ma-carte-otaku.png";
                lien.click();
            });
        }
    </script>
</body>
</html>
